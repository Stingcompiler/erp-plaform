# Render Blueprint for the ERP platform — all services native (NO Docker).
# Connect this repo as a Blueprint; Render builds and runs each service from
# source. Verify the exact Key Value block against current Render docs on first
# deploy (see DEPLOYMENT.md) — the rest follows the standard Blueprint schema.

services:
  # ---------------------------------------------------------------------------
  # erp-api : Django + DRF via Gunicorn (Python native). Also builds and serves
  # the Next.js static export (frontend/out) — one deployable web service, no
  # separate frontend service or CORS hop (see backend/core/frontend.py and
  # config/urls.py, wired only when DEBUG=False).
  # ---------------------------------------------------------------------------
  - type: web
    name: erp-api
    runtime: python
    plan: starter
    region: oregon
    domains:
      - enterprise.vezano.app
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /api/health/
    # `rm -rf node_modules` first: Render keeps the checkout between builds,
    # and a stale entry there (a dangling symlink once slipped into the
    # repo) makes `npm install` fail while the previous release stays live.
    # `npm ci` installs from the lockfile only, the same as CI.
    buildCommand: >-
      (cd ../frontend && rm -rf node_modules && npm ci --no-audit --no-fund && npm run build) &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    # Migrations must NOT run in buildCommand: the build container has no
    # DATABASE_URL, so `migrate` there silently targets a throwaway SQLite
    # file and the production schema is never updated. preDeployCommand runs
    # with the full runtime environment, after the build and before traffic
    # moves to the new version, which is exactly when the schema must change.
    preDeployCommand: python manage.py migrate --noinput && python manage.py seed_roles
    startCommand: "gunicorn config.wsgi:application -c gunicorn.conf.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Render's native Python build image is expected to include Node/npm for
      # the frontend build step above — unverified against current Render docs
      # (no network in the authoring sandbox, same caveat as erp-cache below).
      # If the build fails on `npm`, install Node explicitly in buildCommand
      # (e.g. via nvm) or pin a version here — confirm on first deploy.
      - key: NODE_VERSION
        value: "20.11.1"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SUBSCRIPTION_POLICY
        value: observe
      - key: DJANGO_ALLOWED_HOSTS
        value: "enterprise.vezano.app,.onrender.com"
      # Transactional email (activation links). Optional: with EMAIL_HOST
      # unset the app runs fine and operators deliver links by hand.
      # Set EMAIL_HOST/EMAIL_HOST_USER/EMAIL_HOST_PASSWORD (sync: false keeps
      # the secret out of this file) to enable SMTP delivery.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Vezano <no-reply@vezano.app>"
      # WhatsApp Business (Meta Cloud API). Optional. The verify token is a
      # phrase we choose and paste into the Meta app's webhook screen; the
      # app secret is the Meta app's "App Secret" and signs every delivery.
      # Numbers are connected per company with `manage.py whatsapp_connect`.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Seals the companies' WhatsApp tokens at rest (core.secrets). A
      # dedicated Fernet key, generated once; see DEPLOYMENT.md for rotation.
      - key: SECRETS_ENCRYPTION_KEY
        sync: false
      # The paid persistent disk is attached to erp-api at this path in Render.
      # All FileField uploads (medical reports and subscription proofs) land
      # beneath it and therefore survive deploys and restarts.
      - key: MEDIA_ROOT
        value: /var/data/media/
      # Off-box copies of the nightly logical dumps (docs/go-live-gate-recovery.md).
      # Without these the dump is stored inside the same database it protects.
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Sync Gunicorn workers for the starter instance (see gunicorn.conf.py).
      - key: WEB_CONCURRENCY
        value: "3"
      - key: AUTH_COOKIE_SAMESITE
        value: Lax
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: erp-cache
          property: connectionString

  # ---------------------------------------------------------------------------
  # erp-worker : Celery worker (Python native background worker).
  # Optional today: nothing in the product enqueues tasks at request time;
  # the daily scans run from erp-daily-scans. Deploy this (with erp-cache)
  # only when a feature needs background work, and then drop the cron.
  # ---------------------------------------------------------------------------
  - type: worker
    name: erp-worker
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    # -B embeds the beat scheduler: the daily scans in CELERY_BEAT_SCHEDULE
    # run from this same process. Keep exactly one worker instance while
    # beat is embedded, or the scans run once per instance.
    # --pool=solo: no forked children. The default prefork pool spawned one
    # Django process per CPU (8 on this instance) and blew the 512Mi limit
    # before the first task; three daily scans need exactly one process.
    startCommand: "celery -A config worker -B --loglevel=info --pool=solo"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: erp-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: SUBSCRIPTION_POLICY
        value: observe
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: erp-cache
          property: connectionString

  # ---------------------------------------------------------------------------
  # erp-backup-cron : nightly logical backups (Python native cron job)
  # ---------------------------------------------------------------------------
  - type: cron
    name: erp-backup-cron
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    schedule: "0 2 * * *"   # daily 02:00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_scheduled_backup"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: erp-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: SUBSCRIPTION_POLICY
        value: observe
      # Off-box copies of the nightly logical dumps (docs/go-live-gate-recovery.md).
      # Without these the dump is stored inside the same database it protects.
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString

  # ---------------------------------------------------------------------------
  # erp-daily-scans : receivables, stock and subscription scans, once a day.
  # Runs the same task functions the Celery worker would, in-process, so no
  # worker or broker is needed for them. Deploy EITHER this cron OR the
  # worker+cache pair below, never both (the scans would run twice).
  # ---------------------------------------------------------------------------
  - type: cron
    name: erp-daily-scans
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    schedule: "30 3 * * *"   # daily 03:30 UTC, after the backup
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_daily_scans"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: erp-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: SUBSCRIPTION_POLICY
        value: observe
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString

  # ---------------------------------------------------------------------------
  # erp-cache : managed Key Value store (Redis-compatible) — Celery broker.
  # Optional today: only needed together with erp-worker.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: erp-cache
    plan: starter
    region: oregon
    ipAllowList: []   # only reachable from Render services

databases:
  # ---------------------------------------------------------------------------
  # erp-db : managed PostgreSQL
  # ---------------------------------------------------------------------------
  - name: erp-db
    plan: starter
    region: oregon
    databaseName: erp
    user: erp
