<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل المتاجر على فيزانو</title>
<meta name="description" content="الشركات والمتاجر التي تنشر صفحتها العامة على منصة فيزانو: من هم، وماذا يبيعون، وكيف تتواصل معهم.">
<link rel="canonical" href="{{ url }}">
<meta name="robots" content="index, follow">
<meta property="og:title" content="دليل المتاجر على فيزانو">
<meta property="og:url" content="{{ url }}">
<style>
:root{--accent:#0e7c86;--ink:#14202c;--muted:#5f6d78;--paper:#f6f8f7;--surface:#fff;--line:#d9e0e0}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo","Tajawal",system-ui,sans-serif;line-height:1.7;padding-inline:16px;padding-block:32px 48px}
.wrap{max-width:880px;margin-inline:auto}
h1{font-size:1.8rem;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
li a{color:var(--ink);text-decoration:none;font-weight:700;font-size:1.05rem}
li a:hover{color:var(--accent)}
li p{margin:2px 0 0;color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:.9rem}
footer a{color:var(--muted)}
@media (prefers-color-scheme: dark){:root{--ink:#eef2f3;--muted:#9aa8b1;--paper:#0f1a22;--surface:#16232c;--line:#2a3a44}}
</style>
</head>
<body>
<div class="wrap">
  <h1>دليل المتاجر</h1>
  <p class="lead">شركات ومتاجر تدير أعمالها على فيزانو وتنشر صفحتها العامة هنا.</p>
  {% if sites %}
  <ul>
    {% for site in sites %}
    <li><a href="{{ site.path }}">{{ site.name }}</a>{% if site.tagline %}<p>{{ site.tagline }}</p>{% endif %}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="lead">لا صفحات منشورة بعد.</p>
  {% endif %}
  <footer>يعمل بنظام <a href="{{ platform_url }}">Vezano</a></footer>
</div>
</body>
</html>
